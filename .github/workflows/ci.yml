name: CI

on:
  push:
    branches: [master, main, "v2-*"]
  pull_request:
    branches: [master, main]

jobs:
  qualite:
    name: Tests et critères d'acceptation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest flake8

      - name: Style
        run: flake8 models/ utils/ pages/ tests/ data/ conftest.py --max-line-length=120 --ignore=E501,W503,E221,E241

      - name: Construire le jeu de données
        run: python data/pipelines/build_final_dataset.py

      - name: Entraîner le modèle
        env:
          AGROPREDICT_COMMIT: ${{ github.sha }}
        run: python -m models.train_model

      - name: Critères d'acceptation CA-1 à CA-6
        run: pytest tests/ -v --tb=short

      - name: Publier le modèle comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: modele-${{ github.sha }}
          path: |
            models/yield_model.pkl
            data/raw/senegal_yield_data.sha256
          retention-days: 30

  conteneur:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t agropredict-sn:${{ github.sha }} .

      - name: Vérifier que le conteneur devient sain
        run: |
          docker run -d --name verif -p 8501:8501 agropredict-sn:${{ github.sha }}
          for i in $(seq 1 30); do
            etat=$(docker inspect --format='{{.State.Health.Status}}' verif)
            echo "tentative $i : $etat"
            if [ "$etat" = "healthy" ]; then exit 0; fi
            if [ "$etat" = "unhealthy" ]; then docker logs verif; exit 1; fi
            sleep 5
          done
          docker logs verif
          exit 1

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f verif || true
