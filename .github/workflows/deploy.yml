name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à déployer, par exemple v2.0.0. Laisser vide pour la version courante."
        required: false

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publier:
    name: Publier l'image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Déterminer la version
        id: version
        run: echo "nom=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Construire l'image
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t agropredict-sn:${{ steps.version.outputs.nom }} .

      - name: Publier sur Docker Hub
        if: env.DOCKER_USER != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker tag agropredict-sn:${{ steps.version.outputs.nom }} \
                     "$DOCKER_USER"/agropredict-sn:${{ steps.version.outputs.nom }}
          docker push "$DOCKER_USER"/agropredict-sn:${{ steps.version.outputs.nom }}

      - name: Déclencher le déploiement Streamlit Cloud
        env:
          HOOK: ${{ secrets.STREAMLIT_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
            echo "Déploiement déclenché pour ${{ steps.version.outputs.nom }}."
          else
            echo "STREAMLIT_DEPLOY_HOOK non configuré, étape ignorée."
          fi

# Revenir en arrière : relancer ce workflow via workflow_dispatch en indiquant
# le tag précédent. L'image de cette version est déjà construite et contient
# son propre modèle, aucun réentraînement n'est nécessaire.
